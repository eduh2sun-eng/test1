<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="eduh2sun의 연락처 — 이메일과 깃허브" />
    <title>eduh2sun — Contact Gallery</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --ice: #8fa6c8;
        --accent: #6fd4ff;
        --white: #e8eef8;
        --bg: #000000;
        --mono: "Courier New", Courier, monospace;
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--ice);
        overflow: hidden;
        cursor: crosshair;
        font-family: var(--mono);
      }
      body.hovering {
        cursor: pointer;
      }

      .webgl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        display: block;
        touch-action: none;
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.7) 100%);
      }

      .logo {
        position: fixed;
        top: calc(1.6rem + env(safe-area-inset-top, 0px));
        left: 2.2rem;
        z-index: 10;
        font-size: 0.66rem;
        letter-spacing: 0.34em;
        opacity: 0.5;
      }

      .brand {
        position: fixed;
        top: calc(1.5rem + env(safe-area-inset-top, 0px));
        right: 2.2rem;
        z-index: 10;
        text-align: right;
        line-height: 1.8;
      }
      .brand .b1 {
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        color: var(--white);
        font-weight: 700;
      }
      .brand .b2 {
        font-size: 0.56rem;
        letter-spacing: 0.26em;
        color: var(--accent);
        opacity: 0.8;
      }
      .brand .b3 {
        font-size: 0.56rem;
        letter-spacing: 0.26em;
        opacity: 0.42;
      }

      .counter {
        position: fixed;
        bottom: calc(1.6rem + env(safe-area-inset-bottom, 0px));
        left: 2.2rem;
        z-index: 10;
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        line-height: 2.1;
        color: rgba(143, 166, 200, 0.55);
      }
      .counter .n {
        color: var(--white);
      }
      .counter .hint {
        opacity: 0.45;
        font-size: 0.54rem;
        letter-spacing: 0.24em;
      }

      /* 오른쪽 아래: 언제든 바로 누를 수 있는 연락처 */
      .links {
        position: fixed;
        bottom: calc(1.6rem + env(safe-area-inset-bottom, 0px));
        right: 2.2rem;
        z-index: 10;
        text-align: right;
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        line-height: 2.1;
      }
      .links a {
        color: var(--ice);
        text-decoration: none;
        border-bottom: 1px solid rgba(143, 166, 200, 0.25);
        transition: color 0.25s ease, border-color 0.25s ease;
      }
      .links a:hover,
      .links a:focus-visible {
        color: var(--accent);
        border-color: var(--accent);
      }
      .links .k {
        opacity: 0.45;
        margin-right: 0.6em;
      }

      a:focus-visible {
        outline: 1px dashed var(--accent);
        outline-offset: 4px;
      }

      .card {
        position: fixed;
        left: 50%;
        bottom: calc(2.4rem + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 1.2rem);
        z-index: 12;
        min-width: 300px;
        padding: 0.9rem 1.4rem;
        border: 1px solid rgba(143, 166, 200, 0.22);
        background: rgba(4, 6, 12, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      .card.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .card .t {
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        color: var(--white);
        word-break: break-all;
      }
      .card .m {
        margin-top: 0.35rem;
        font-size: 0.55rem;
        letter-spacing: 0.24em;
        color: var(--accent);
        opacity: 0.75;
      }
      .card .go {
        display: none;
        margin-top: 0.7rem;
        padding: 0.45rem 0.8rem;
        border: 1px solid var(--accent);
        color: var(--accent);
        font-size: 0.6rem;
        letter-spacing: 0.22em;
        text-decoration: none;
        transition: background 0.25s ease, color 0.25s ease;
      }
      .card .go.show {
        display: inline-block;
      }
      .card .go:hover {
        background: var(--accent);
        color: #000;
      }
      .card .esc {
        margin-top: 0.55rem;
        font-size: 0.5rem;
        letter-spacing: 0.24em;
        opacity: 0.4;
      }

      @media (max-width: 940px) {
        .logo,
        .brand {
          top: calc(1rem + env(safe-area-inset-top, 0px));
        }
        .logo {
          left: 1.1rem;
          max-width: 45vw;
        }
        .brand {
          right: 1.1rem;
        }
        .counter {
          left: 1.1rem;
          bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px));
        }
        .links {
          right: auto;
          left: 1.1rem;
          text-align: left;
          bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px));
        }
        .card {
          min-width: 0;
          width: calc(100% - 2.2rem);
          bottom: calc(8.4rem + env(safe-area-inset-bottom, 0px));
        }
      }
    </style>
  </head>
  <body>
    <canvas class="webgl" aria-hidden="true"></canvas>
    <div class="vignette"></div>

    <div class="logo">ED—2026 / CONTACT_GALLERY</div>

    <div class="brand">
      <div class="b1">EDUH2SUN</div>
      <div class="b2">CONTACT_TUNNEL</div>

    </div>

    <div class="counter">
      WORK <span class="n">01</span> / <span class="tot">18</span><br />

    </div>

    <nav class="links" aria-label="연락처">
      <div><span class="k">MAIL</span><a href="mailto:eduh2sun@gmail.com">eduh2sun@gmail.com</a></div>
      <div><span class="k">GIT</span><a href="https://github.com/eduh2sun-eng" target="_blank" rel="noopener">github.com/eduh2sun-eng</a></div>
    </nav>

    <div class="card" role="dialog" aria-live="polite">
      <div class="t">—</div>
      <div class="m">—</div>
      <a class="go" href="#" target="_blank" rel="noopener">열기</a>
      <div class="esc">ESC 또는 화면 클릭으로 터널로 돌아가기</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      /* ---------- 내용 ---------- */
      const CONTACTS = {
        0: {
          kind: "contact",
          label: "EMAIL",
          value: "eduh2sun@gmail.com",
          href: "mailto:eduh2sun@gmail.com",
          meta: "CONTACT · 메일 보내기",
          button: "메일 쓰기",
        },
        1: {
          kind: "contact",
          label: "GITHUB",
          value: "github.com/eduh2sun-eng",
          href: "https://github.com/eduh2sun-eng",
          meta: "CONTACT · 저장소 둘러보기",
          button: "깃허브 열기",
        },
      };
      const NAMES = [
        "CONCENTRIC FIELD", "MOIRE LINES", "DOT LATTICE", "SINE DRIFT",
        "POLAR RAYS", "BROKEN GRID", "ORBIT TRACE", "CONTOUR MAP",
        "STATIC NOISE", "SPIRAL ARM", "BAR CODE", "WAVE INTERFERENCE",
        "CROSSHATCH", "RING STACK", "SCAN LINES", "FLOW FIELD",
      ];

      const N = 18;
      const items = [];
      let a = 0;
      for (let i = 0; i < N; i++) {
        if (CONTACTS[i]) items.push(CONTACTS[i]);
        else items.push({ kind: "art", name: NAMES[a], pattern: a++, seed: i * 97 + 13 });
      }

      /* ---------- 패턴 그리기 ---------- */
      const TW = 512, TH = 680;
      const ICE = "#8fa6c8", ACC = "#6fd4ff", WHITE = "#e8eef8", PAPER = "#04060c";

      function rng(seed) {
        let s = seed >>> 0;
        return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
      }

      function drawArt(ctx, p, seed) {
        const r = rng(seed);
        const w = TW, h = TH - 90, cx = w / 2, cy = h / 2;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, w, h);
        ctx.clip();
        ctx.lineWidth = 1.5;
        const col = () => (r() < 0.22 ? ACC : r() < 0.5 ? WHITE : ICE);
        switch (p % 16) {
          case 0:
            for (let k = 8; k < 330; k += 10) {
              ctx.strokeStyle = k % 50 < 10 ? ACC : ICE;
              ctx.beginPath(); ctx.arc(cx + r() * 4, cy, k, 0, Math.PI * 2); ctx.stroke();
            }
            break;
          case 1:
            ctx.strokeStyle = ICE;
            for (let x = -h; x < w + h; x += 7) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + h * 0.6, h); ctx.stroke(); }
            ctx.strokeStyle = ACC; ctx.globalAlpha = 0.7;
            for (let x = -h; x < w + h; x += 7.6) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + h * 0.55, h); ctx.stroke(); }
            break;
          case 2:
            for (let y = 20; y < h; y += 22) for (let x = 20; x < w; x += 22) {
              const d = Math.hypot(x - cx, y - cy);
              ctx.fillStyle = d < 120 ? ACC : ICE;
              ctx.beginPath(); ctx.arc(x, y, 1 + 5 * Math.abs(Math.sin(d / 40)), 0, Math.PI * 2); ctx.fill();
            }
            break;
          case 3:
            for (let k = 0; k < 40; k++) {
              ctx.strokeStyle = k % 9 === 0 ? ACC : ICE;
              ctx.beginPath();
              for (let x = 0; x <= w; x += 4) ctx.lineTo(x, 30 + k * 14 + Math.sin(x / 40 + k * 0.35) * 22);
              ctx.stroke();
            }
            break;
          case 4:
            for (let k = 0; k < 180; k++) {
              const t = (k / 180) * Math.PI * 2, len = 60 + r() * 260;
              ctx.strokeStyle = r() < 0.15 ? ACC : ICE;
              ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(t) * len, cy + Math.sin(t) * len); ctx.stroke();
            }
            break;
          case 5:
            for (let y = 0; y < h; y += 32) for (let x = 0; x < w; x += 32) {
              if (r() < 0.3) continue;
              ctx.strokeStyle = col();
              ctx.strokeRect(x + 4 + r() * 6, y + 4 + r() * 6, 20, 20);
            }
            break;
          case 6:
            for (let k = 0; k < 26; k++) {
              ctx.strokeStyle = col();
              ctx.beginPath();
              ctx.ellipse(cx, cy, 30 + k * 9, 12 + k * 4, k * 0.13, 0, Math.PI * 2);
              ctx.stroke();
            }
            break;
          case 7: {
            const pk = [[r() * w, r() * h], [r() * w, r() * h], [r() * w, r() * h]];
            for (let lv = 1; lv < 18; lv++) {
              ctx.strokeStyle = lv % 5 === 0 ? ACC : ICE;
              pk.forEach(([px, py]) => { ctx.beginPath(); ctx.arc(px, py, lv * 16, 0, Math.PI * 2); ctx.stroke(); });
            }
            break;
          }
          case 8:
            for (let k = 0; k < 2600; k++) { ctx.fillStyle = col(); ctx.fillRect((r() * w) | 0, (r() * h) | 0, 2, 2); }
            break;
          case 9:
            for (let arm = 0; arm < 3; arm++) {
              ctx.strokeStyle = arm === 0 ? ACC : ICE;
              ctx.beginPath();
              for (let t = 0; t < 26; t += 0.05) {
                const rr = t * 11, th = t + (arm * Math.PI * 2) / 3;
                ctx.lineTo(cx + Math.cos(th) * rr, cy + Math.sin(th) * rr);
              }
              ctx.stroke();
            }
            break;
          case 10:
            for (let x = 30; x < w - 30; ) {
              const bw = 1 + ((r() * 8) | 0);
              ctx.fillStyle = r() < 0.12 ? ACC : WHITE;
              ctx.fillRect(x, 60, bw, h - 120);
              x += bw + 2 + r() * 8;
            }
            break;
          case 11: {
            const img = ctx.createImageData(w, h);
            const s1 = [w * 0.3, h * 0.35], s2 = [w * 0.7, h * 0.65];
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
              const v = Math.sin(Math.hypot(x - s1[0], y - s1[1]) / 9) + Math.sin(Math.hypot(x - s2[0], y - s2[1]) / 9);
              const on = v > 0.9, hot = v > 1.7, i = (y * w + x) * 4;
              img.data[i] = hot ? 111 : on ? 143 : 4;
              img.data[i + 1] = hot ? 212 : on ? 166 : 6;
              img.data[i + 2] = hot ? 255 : on ? 200 : 12;
              img.data[i + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            break;
          }
          case 12:
            ctx.strokeStyle = ICE;
            for (let k = -h; k < w + h; k += 12) {
              ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + h, h); ctx.stroke();
              if (k % 36 === 0) { ctx.beginPath(); ctx.moveTo(k + h, 0); ctx.lineTo(k, h); ctx.stroke(); }
            }
            ctx.fillStyle = ACC; ctx.fillRect(cx - 40, cy - 40, 80, 80);
            break;
          case 13:
            for (let k = 0; k < 14; k++) {
              ctx.lineWidth = 2 + k * 0.6;
              ctx.strokeStyle = k % 4 === 0 ? ACC : ICE;
              ctx.beginPath(); ctx.arc(cx, 60 + k * 36, 90, 0, Math.PI * 2); ctx.stroke();
            }
            break;
          case 14:
            for (let y = 0; y < h; y += 3) {
              ctx.fillStyle = y % 60 < 3 ? ACC : ICE;
              ctx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(y / 70));
              ctx.fillRect(0, y, w * (0.3 + 0.7 * Math.abs(Math.cos(y / 45))), 1);
            }
            break;
          default:
            for (let k = 0; k < 340; k++) {
              let x = r() * w, y = r() * h;
              ctx.strokeStyle = r() < 0.12 ? ACC : ICE;
              ctx.beginPath(); ctx.moveTo(x, y);
              for (let s = 0; s < 22; s++) {
                const ang = Math.sin(x / 70) * 2 + Math.cos(y / 60) * 2;
                x += Math.cos(ang) * 6; y += Math.sin(ang) * 6; ctx.lineTo(x, y);
              }
              ctx.stroke();
            }
        }
        ctx.restore();
      }

      function makeTexture(item, idx) {
        const c = document.createElement("canvas");
        c.width = TW; c.height = TH;
        const ctx = c.getContext("2d");
        ctx.fillStyle = PAPER;
        ctx.fillRect(0, 0, TW, TH);

        if (item.kind === "art") {
          drawArt(ctx, item.pattern, item.seed);
        } else {
          ctx.strokeStyle = ACC; ctx.lineWidth = 2;
          ctx.strokeRect(24, 24, TW - 48, TH - 138);
          ctx.globalAlpha = 0.18;
          for (let y = 40; y < TH - 130; y += 6) { ctx.fillStyle = ICE; ctx.fillRect(40, y, TW - 80, 1); }
          ctx.globalAlpha = 1;
          ctx.fillStyle = ACC;
          ctx.font = "bold 74px 'Courier New', monospace";
          ctx.textAlign = "center";
          ctx.fillText(item.label, TW / 2, 250);
          ctx.fillStyle = WHITE;
          let size = 30;
          ctx.font = `${size}px 'Courier New', monospace`;
          while (ctx.measureText(item.value).width > TW - 90 && size > 14) {
            size -= 1; ctx.font = `${size}px 'Courier New', monospace`;
          }
          ctx.fillText(item.value, TW / 2, 330);
          ctx.fillStyle = ICE;
          ctx.font = "18px 'Courier New', monospace";
          ctx.fillText("[ CLICK ]", TW / 2, 440);
          ctx.textAlign = "left";
        }

        ctx.fillStyle = PAPER;
        ctx.fillRect(0, TH - 90, TW, 90);
        ctx.fillStyle = "rgba(143,166,200,0.35)";
        ctx.fillRect(24, TH - 82, TW - 48, 1);
        ctx.fillStyle = WHITE;
        ctx.font = "20px 'Courier New', monospace";
        const title = item.kind === "art" ? item.name : item.label;
        ctx.fillText(`Nº${String(idx + 1).padStart(2, "0")}  ${title}`, 24, TH - 46);
        ctx.fillStyle = ACC;
        ctx.font = "14px 'Courier New', monospace";
        ctx.fillText(item.kind === "art" ? "GENERATIVE / CANVAS_2D" : "CONTACT / OPEN", 24, TH - 20);

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 4;
        return tex;
      }

      /* ---------- 장면 ---------- */
      const canvas = document.querySelector(".webgl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.Fog(0x000000, 3, 30);

      const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 80);

      const GAP = 3.2;
      const LEN = N * GAP;
      const HALF = 2.1; // 벽까지 거리
      const PW = 1.5, PH = PW * (TH / TW);

      const panels = [];
      const planeGeo = new THREE.PlaneGeometry(PW, PH);
      const frameGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(PW + 0.08, PH + 0.08));

      items.forEach((item, i) => {
        const group = new THREE.Group();
        const mat = new THREE.MeshBasicMaterial({ map: makeTexture(item, i) });
        const mesh = new THREE.Mesh(planeGeo, mat);
        const frameMat = new THREE.LineBasicMaterial({ color: item.kind === "contact" ? 0x6fd4ff : 0x8fa6c8, transparent: true, opacity: item.kind === "contact" ? 0.9 : 0.35 });
        const frame = new THREE.LineSegments(frameGeo, frameMat);
        group.add(mesh, frame);
        const left = i % 2 === 0;
        group.position.x = left ? -HALF : HALF;
        group.position.y = 0.05;
        group.rotation.y = left ? Math.PI / 2 : -Math.PI / 2;
        mesh.userData.index = i;
        scene.add(group);
        panels.push({ group, mesh, frame, frameMat, item, baseZ: -i * GAP, left, hover: 0 });
      });

      // 복도 골격: 일정 간격의 사각 프레임과 바닥/천장 레일
      const RIB = 1.6;
      const ribCount = Math.ceil(36 / RIB) + 2;
      const ribPts = [];
      const W2 = HALF + 0.35, H2 = 1.55;
      for (let k = 0; k < ribCount; k++) {
        const z = -k * RIB;
        ribPts.push(-W2, -H2, z, W2, -H2, z, W2, -H2, z, W2, H2, z, W2, H2, z, -W2, H2, z, -W2, H2, z, -W2, -H2, z);
      }
      const ribGeo = new THREE.BufferGeometry();
      ribGeo.setAttribute("position", new THREE.Float32BufferAttribute(ribPts, 3));
      const ribs = new THREE.LineSegments(ribGeo, new THREE.LineBasicMaterial({ color: 0x8fa6c8, transparent: true, opacity: 0.16 }));
      scene.add(ribs);

      const railPts = [];
      const railLen = 40;
      for (let x = -W2; x <= W2 + 0.001; x += (W2 * 2) / 8) {
        railPts.push(x, -H2, 4, x, -H2, -railLen, x, H2, 4, x, H2, -railLen);
      }
      for (let y = -H2; y <= H2 + 0.001; y += (H2 * 2) / 4) {
        railPts.push(-W2, y, 4, -W2, y, -railLen, W2, y, 4, W2, y, -railLen);
      }
      const railGeo = new THREE.BufferGeometry();
      railGeo.setAttribute("position", new THREE.Float32BufferAttribute(railPts, 3));
      const rails = new THREE.LineSegments(railGeo, new THREE.LineBasicMaterial({ color: 0x6fd4ff, transparent: true, opacity: 0.07 }));
      scene.add(rails);

      // 떠다니는 먼지
      const dustN = 500, dust = new Float32Array(dustN * 3);
      for (let k = 0; k < dustN; k++) {
        dust[k * 3] = (Math.random() - 0.5) * W2 * 2;
        dust[k * 3 + 1] = (Math.random() - 0.5) * H2 * 2;
        dust[k * 3 + 2] = -Math.random() * 36;
      }
      const dustGeo = new THREE.BufferGeometry();
      dustGeo.setAttribute("position", new THREE.BufferAttribute(dust, 3));
      const dustPts = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x8fa6c8, size: 0.012, transparent: true, opacity: 0.6 }));
      scene.add(dustPts);

      /* ---------- 상태 ---------- */
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let travel = -2.6, travelTarget = -2.6;
      let focused = null;
      const mouse = new THREE.Vector2(0, 0);
      const ndc = new THREE.Vector2(-9, -9);
      const lookAt = new THREE.Vector3(0, 0, -10);
      const camGoal = new THREE.Vector3();
      const lookGoal = new THREE.Vector3();
      const raycaster = new THREE.Raycaster();
      let hovered = null;
      let lastInput = 0;

      const refZ = () => 2.4 - travel;

      const elN = document.querySelector(".counter .n");
      const card = document.querySelector(".card");
      const cardT = card.querySelector(".t");
      const cardM = card.querySelector(".m");
      const cardGo = card.querySelector(".go");

      function wrapPanels() {
        const z0 = refZ();
        panels.forEach((p) => {
          let rel = p.baseZ - z0 - 3;
          rel = (((rel % LEN) - LEN) % LEN);
          p.group.position.z = z0 + 3 + rel;
        });
        ribs.position.z = Math.ceil(z0 / RIB) * RIB + RIB;
        rails.position.z = z0;
        dustPts.position.z = Math.ceil(z0 / 12) * 12;
      }

      function openPanel(p) {
        focused = p;
        const it = p.item;
        const no = `Nº${String(p.mesh.userData.index + 1).padStart(2, "0")}`;
        if (it.kind === "contact") {
          cardT.textContent = `${no}  ${it.label} — ${it.value}`;
          cardM.textContent = it.meta;
          cardGo.href = it.href;
          cardGo.textContent = it.button;
          cardGo.classList.add("show");
        } else {
          cardT.textContent = `${no}  ${it.name}`;
          cardM.textContent = "GENERATIVE · CANVAS 2D · 2026";
          cardGo.classList.remove("show");
        }
        card.classList.add("on");
      }

      function closePanel() {
        if (!focused) return;
        const z = focused.group.position.z;
        travel = travelTarget = 2.4 - (z + 2.2);
        focused = null;
        card.classList.remove("on");
      }

      /* ---------- 입력 ---------- */
      window.addEventListener("wheel", (e) => {
        if (focused) return;
        travelTarget += e.deltaY * 0.0035;
        lastInput = performance.now();
      }, { passive: true });

      let down = null;
      canvas.addEventListener("pointerdown", (e) => {
        down = { x: e.clientX, y: e.clientY, last: e.clientY, moved: 0 };
      });
      window.addEventListener("pointermove", (e) => {
        mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        ndc.copy(mouse);
        if (down) {
          const dy = e.clientY - down.last;
          down.last = e.clientY;
          down.moved += Math.abs(dy) + Math.abs(e.clientX - down.x) * 0.1;
          if (!focused && e.pointerType !== "mouse") {
            travelTarget -= dy * 0.012;
            lastInput = performance.now();
          }
        }
      });
      window.addEventListener("pointerup", (e) => {
        if (!down) return;
        const wasClick = down.moved < 8;
        down = null;
        if (!wasClick || e.target !== canvas) return;
        if (focused) { closePanel(); return; }
        ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        const hit = raycaster.intersectObjects(panels.map((p) => p.mesh))[0];
        if (hit) openPanel(panels[hit.object.userData.index]);
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePanel();
        if (focused) return;
        if (e.key === "ArrowDown" || e.key === "ArrowRight") travelTarget += GAP;
        if (e.key === "ArrowUp" || e.key === "ArrowLeft") travelTarget -= GAP;
        lastInput = performance.now();
      });

      function fitCamera() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.fov = camera.aspect < 1 ? 62 + (1 - camera.aspect) * 48 : 62;
        camera.updateProjectionMatrix();
      }
      fitCamera();
      if (window.matchMedia("(pointer: coarse)").matches) {
        document.querySelector(".counter .hint").textContent = "스와이프로 이동 · 탭해서 열기";
      }
      window.addEventListener("resize", () => {
        fitCamera();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* ---------- 루프 ---------- */
      const clock = new THREE.Clock();
      camera.position.set(0, 0, refZ() + 6);

      function tick() {
        const dt = Math.min(clock.getDelta(), 0.05);
        const k = 1 - Math.pow(0.0025, dt);

        if (!focused && !reduceMotion && performance.now() - lastInput > 2500) {
          travelTarget += dt * 0.35;
        }
        travel += (travelTarget - travel) * k;
        wrapPanels();

        if (focused) {
          const g = focused.group;
          const dist = Math.min(3.6, Math.max(2.05, 0.9 / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect)));
          camGoal.set(focused.left ? -HALF + dist : HALF - dist, g.position.y - 0.12, g.position.z);
          lookGoal.copy(g.position);
        } else {
          camGoal.set(mouse.x * 0.35, mouse.y * 0.18, refZ());
          lookGoal.set(mouse.x * 1.2, mouse.y * 0.6, refZ() - 10);
        }
        camera.position.lerp(camGoal, k * 0.9);
        lookAt.lerp(lookGoal, k * 0.9);
        camera.lookAt(lookAt);

        // 마우스 올린 작품 강조
        hovered = null;
        if (!focused && !down) {
          raycaster.setFromCamera(ndc, camera);
          const hit = raycaster.intersectObjects(panels.map((p) => p.mesh))[0];
          if (hit && hit.distance < 14) hovered = panels[hit.object.userData.index];
        }
        document.body.classList.toggle("hovering", !!hovered);
        panels.forEach((p) => {
          const on = p === hovered || p === focused ? 1 : 0;
          p.hover += (on - p.hover) * k;
          p.group.scale.setScalar(1 + p.hover * 0.05);
          p.frameMat.opacity = (p.item.kind === "contact" ? 0.9 : 0.35) + p.hover * 0.6;
          p.frameMat.color.set(p.hover > 0.5 || p.item.kind === "contact" ? 0x6fd4ff : 0x8fa6c8);
        });

        // 가장 가까운 작품 번호
        let best = 0, bestD = Infinity;
        const zc = focused ? focused.group.position.z : refZ() - 3;
        panels.forEach((p, i) => {
          if (!focused && p.group.position.z > refZ() - 2) return;
          const d = Math.abs(p.group.position.z - zc);
          if (d < bestD) { bestD = d; best = i; }
        });
        elN.textContent = String(best + 1).padStart(2, "0");

        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
